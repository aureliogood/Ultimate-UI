name: UltimateUI
version: 1.4.2
main: dev.xqedii.ultimateUI.CommunityUltimateUI
api-version: '1.20'
folia-supported: true
authors: [ Xqedii ]
softdepend:
  - floodgate
  - Geyser-Spigot
  - PlaceholderAPI
  - ItemsAdder
  - Oraxen
  - Nexo
  - CraftEngine
  - Skript
  - Citizens
  - FancyNpcs
  - BetterHud
commands:
  uui:
    usage: /uui [open <name> [hud] [autoclose] [player]|create <name>|edit <name>|delete <name>|close [name]|menu|sensitivity <0.1-5>|shaders [on|off|toggle|reset] [player]|cursor [on|off|toggle|reset] [player]|world [help|place <page> [id]|list|remove|movehere|move|rotate|lookat|interactive|perplayer|size|mode|toggle|tp|reload]|bedrock [build|pages|status]|reload]
    description: UltimateUI command
    permission: ultimateui.command.use

permissions:
  ultimateui.admin:
    description: Full access to all UltimateUI commands
    default: op
    children:
      ultimateui.command.use: true
      ultimateui.command.open: true
      ultimateui.command.create: true
      ultimateui.command.edit: true
      ultimateui.command.delete: true
      ultimateui.command.close: true
      ultimateui.command.sensitivity: true
      ultimateui.command.shaders: true
      ultimateui.command.shaders.others: true
      ultimateui.command.cursor: true
      ultimateui.command.cursor.others: true
      ultimateui.command.world: true
      ultimateui.command.reload: true
  ultimateui.command.use:
    description: Access to the /uui command at all - players without it cannot use or tab-complete /uui
    default: op
  ultimateui.command.open:
    description: Open UIs with /uui open
    default: op
  ultimateui.command.create:
    description: Create UIs with /uui create
    default: op
  ultimateui.command.edit:
    description: Edit UIs with /uui edit
    default: op
  ultimateui.command.delete:
    description: Delete UIs with /uui delete
    default: op
  ultimateui.command.close:
    description: Close UIs with /uui close
    default: op
  ultimateui.command.sensitivity:
    description: Set cursor sensitivity with /uui sensitivity
    default: false
  ultimateui.command.shaders:
    description: Turn the shader fix on or off for yourself with /uui shaders
    default: true
  ultimateui.command.shaders.others:
    description: Change the shader fix of other players with /uui shaders <action> <player>
    default: op
  ultimateui.command.cursor:
    description: Turn the client-sided cursor on or off for yourself with /uui cursor
    default: true
  ultimateui.command.cursor.others:
    description: Change the client-sided cursor of other players with /uui cursor <action> <player>
    default: op
  ultimateui.command.world:
    description: Place any UI in the world and manage it with /uui world
    default: op
  ultimateui.command.reload:
    description: Reload UltimateUI config with /uui reload
    default: op
